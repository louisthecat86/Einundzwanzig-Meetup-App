name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'            # Versionierte Releases bei Tags wie v1.0.0
  workflow_dispatch:

# Berechtigung zum Erstellen/Aktualisieren von Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Java Setup
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 2. Android SDK Tools bereitstellen
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    # 3. Flutter Setup
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. Android Versionen installieren
    - name: Install Android SDK & NDK
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

    # 5. Abhängigkeiten laden
    - name: Clean & Get Dependencies
      run: |
        flutter clean
        flutter pub get

    # 5b. Release-Keystore aus Secrets wiederherstellen
    - name: Setup Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
        cat > android/key.properties <<EOF
        storePassword=$STORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=release.jks
        EOF

    # 6. Bauen (Obfuscation aktiviert)
    - name: Build APK
      run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

    # 7. APK mit Versionsnummer + Datum umbenennen
    - name: Rename APK
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
        DATE=$(date +%Y%m%d)
        cp build/app/outputs/flutter-apk/app-release.apk \
           build/app/outputs/flutter-apk/einundzwanzig-meetup-v${VERSION}-${DATE}.apk

    # 8. Als Artifact hochladen (Backup)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: einundzwanzig-app-release
        path: build/app/outputs/flutter-apk/app-release.apk

    # 9. Debug-Symbole sichern
    - name: Upload Debug Symbols
      uses: actions/upload-artifact@v4
      with:
        name: debug-symbols
        path: build/debug-info/

    # 10. Rolling Release aktualisieren (bei jedem Push auf main)
    - name: Update Latest Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Neueste Version (automatisch)"
        body: |
          **Automatisch generierte APK** vom letzten Commit auf `main`.

          Commit: ${{ github.sha }}
          Datum: ${{ github.event.head_commit.timestamp }}

          ### Installation
          1. APK herunterladen
          2. Auf Android-Gerät übertragen
          3. "Aus unbekannten Quellen installieren" erlauben
          4. APK antippen → Installieren

          _Dieser Release wird bei jedem Push auf `main` automatisch aktualisiert._
        files: |
          build/app/outputs/flutter-apk/einundzwanzig-meetup-*.apk
        prerelease: true
        make_latest: true

    # 11. Versionierter Release (bei Tag-Push wie v1.0.0)
    - name: Create Versioned Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: "Release ${{ github.ref_name }}"
        body: |
          ## Einundzwanzig Meetup App ${{ github.ref_name }}

          ### Download
          Die APK unten herunterladen und auf dem Android-Gerät installieren.

          ### Änderungen
          Siehe Commit-Historie seit dem letzten Release.
        files: |
          build/app/outputs/flutter-apk/einundzwanzig-meetup-*.apk
        prerelease: false
        make_latest: true

    # 12. Zapstore nur bei einem Versions-Tag, und erst wenn die APK am
    #     Release hängt. zsp liest sie über repository in zapstore.yaml.
    #     Ohne Signier-Secret bleibt dieser Release grün.
    - name: Publish to Zapstore
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -z "$SIGN_WITH" ]; then
          echo "::warning title=Zapstore übersprungen::ZAPSTORE_SIGN_WITH fehlt. Die APK liegt auf dem GitHub-Release, nicht im Zapstore."
          exit 0
        fi
        curl -fsSL -o "$RUNNER_TEMP/zsp" \
          https://github.com/zapstore/zsp/releases/download/v2.0.1/zsp-2.0.1-linux-amd64
        chmod +x "$RUNNER_TEMP/zsp"
        "$RUNNER_TEMP/zsp" publish -q
