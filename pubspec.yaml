name: einundzwanzig_meetup_app
description: "Einundzwanzig Meetup App – Badge-System mit NFC, QR & Nostr Web of Trust"
publish_to: 'none'
version: 1.6.2+21

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  url_launcher: ^6.2.5
  home_widget: ^0.6.0
  package_info_plus: ^8.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.0.7
  just_audio: ^0.9.36

  # Networking & Data
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  shared_preferences: ^2.5.4
  icalendar_parser: ^2.0.0

  # NFC
  nfc_manager: ^4.1.1
  nfc_manager_ndef: ^1.0.1

  # Crypto & Nostr
  crypto: ^3.0.6
  dbcrypt: ^2.0.0
  nostr: ^1.5.0
  # NIP-44 (Grundlage für den Remote-Signer NIP-46): selbst umgesetzt, weil
  # jedes NIP-44-Paket auf pub.dev über bip340 0.3 mit nostr 1.5.0 kollidiert.
  pointycastle: ^3.9.1
  convert: ^3.1.1
  # NIP-49: passwortverschluesselter Schluessel-Export (ncryptsec).
  # scrypt kommt aus pointycastle (oben), XChaCha20-Poly1305 aus cryptography —
  # pointycastles Fassung scheitert im Browser an 64-Bit-Ganzzahlen. bech32 für
  # die Kodierung, unorm_dart für die vom NIP verlangte NFKC-Normalisierung des
  # Passworts.
  cryptography: ^2.7.0
  bech32: ^0.2.2
  unorm_dart: ^0.3.0

  # NEU: Verschlüsselung für das Backup
  encrypt: ^5.0.3

  # Secure Storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.4

  # Backup & Sharing
  add_2_calendar: ^3.0.1
  share_plus: ^10.1.4
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  intl: ^0.20.2

  # Standort & Karte (Meetups in der Nähe)
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  passkeys: ^2.17.4

  flutter_svg: any
  provider: ^6.1.5+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true   # aktiviert gen-l10n (Mehrsprachigkeit)
  assets:
    - assets/images/logo.png
    - assets/images/intro_logo_86.png
    - assets/images/intro_background_87.jpg
    - assets/images/app_icon_83.jpg
    - assets/images/einundzwanzig_logo.svg
    - assets/images/nostr_icon.png
    - assets/icons/bitcoin.svg
    - assets/images/satoshiduell.png


